<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkMap — пространство идей</title><link rel="stylesheet" href="/static/style.css"></head>
<body><aside class="rail"><b class="logo">i.</b><button id="mapTab" title="Карта">◈</button><button id="roadTab" title="Roadmap">☷</button><span>INKMAP</span></aside>
<main><header><div><small>ВАШЕ ПРОСТРАНСТВО МЫСЛИ</small><h1>Карта идей <em> / </em><span>Новый проект</span></h1></div><div class="actions"><span id="saveState">Загрузка…</span><button id="import">↑ Импорт</button><button id="export">↓ Экспорт</button><button id="context">Контекст для Codex</button><button id="theme" aria-pressed="false">☾ Тёмная тема</button></div></header>
<section class="toolbar"><div><button id="add" class="primary">＋ Идея</button><select id="newShape" aria-label="Форма новой фигуры"><option value="ellipse">Овал</option><option value="rectangle">Прямоугольник</option><option value="rounded">Скруглённый</option><option value="diamond">Ромб</option><option value="triangle">Треугольник</option></select><button id="shape">◇ Фигура</button><button id="draw">✎ Рисовать</button><button id="erase">⌫ Ластик</button><button id="link">↗ Связать</button></div><div><button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Shift+Z">↷</button><button id="zoomOut">−</button><span id="zoom">100%</span><button id="zoomIn">＋</button><button id="home">В центр</button></div></section>
<div class="workspace"><section id="canvas"><div id="world"><svg id="lines"></svg><div id="nodes"></div></div></section><section id="roadmap" hidden></section><aside id="inspector"><small>ДЕТАЛИ ИДЕИ</small><h2>Начните с мысли</h2><p>Выберите карточку на холсте, чтобы добавить заметку, вложения или превратить её в задачу.</p></aside></div><footer><span id="count"></span><span>Локальная карта · InkMap V1</span></footer></main><div id="voiceDock" hidden role="status"><span id="voiceState"></span><button id="voiceStop">■ Остановить и добавить</button><button id="voiceCancel">Отменить запись</button></div><div id="contextMenu" role="menu" aria-label="Действия холста" hidden></div><input id="fileInput" type="file" hidden accept=".md,.json"><script type="module" src="/static/app.js"></script></body></html>
